<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JALOGO — صانع الشعارات بالذكاء الاصطناعي</title>
  <meta name="description" content="ولّد شعاراً احترافياً لعلامتك بالذكاء الاصطناعي في ثوانٍ — مجاناً." />
  <!-- 🚧 صفحة مبدئية لربط النطاق والتحقق من النشر — واجهة التوليد
       الكاملة (المعالج، شبكة المسودات، تركيب الاسم) في المرحلة التالية. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      background: #0a0e17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif;
      padding: 24px; text-align: center;
    }
    .card { max-width: 460px; }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #8b5cf6);
      display: flex; align-items: center; justify-content: center; font-size: 34px;
    }
    h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; }
    h1 span { background: linear-gradient(90deg, #f59e0b, #ec4899); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.9; margin-top: 12px; }
    .soon { display: inline-block; margin-top: 20px; padding: 8px 18px; border-radius: 999px;
      background: rgba(245, 158, 11, 0.12); border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24; font-size: 13px; font-weight: 700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">🎨</div>
    <h1><span>JALOGO</span> — شعارك في ثوانٍ</h1>
    <p>
      صانع شعارات بالذكاء الاصطناعي: اكتب اسم علامتك ومجالها، واختر أسلوباً،
      واحصل على خيارات احترافية فوراً — مجاناً.
    </p>
    <span class="soon">🚀 الإطلاق قريباً — الخدمة قيد التجهيز</span>
  </div>
</body>
</html>
