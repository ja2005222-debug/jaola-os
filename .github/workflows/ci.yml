# 🛡️ شبكة أمان الاستقرار — كل درس مدفوع الثمن محمي باختبار دائم.
# أي PR يكسر سلوكاً مُصلَحاً سابقاً يُرفض هنا قبل الدمج.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend-tests:
    name: اختبارات الخادم
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # postinstall يبني الواجهة — نتخطاه هنا (لها job مستقل)
      - name: تثبيت تبعيات الخادم
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: تشغيل الاختبارات
        working-directory: backend
        env:
          TEST_TRANSACTION_MONGO_URI: mongodb://127.0.0.1:27017/jaola_transaction_tests
        run: npm test
      - name: Audit every generated clone
        working-directory: backend
        run: node --import ./tests/helpers/mockProviders.mjs scripts/auditClones.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clone-readiness-audit
          path: backend/docs/CLONE_READINESS_AUDIT.json
          if-no-files-found: error

  video-service-tests:
    name: اختبارات خدمة الفيديو
    runs-on: ubuntu-latest
    # قاعدة اختبار حقيقية — تُشغَّل نفس المجموعة على المخزنين (ملفات +
    # Postgres) فلا يتباعد سلوكهما بصمت، وهو الخطر الوحيد في وجود
    # تطبيقين للعقد نفسه.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: videotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-service/package-lock.json
      - name: تثبيت تبعيات خدمة الفيديو
        working-directory: video-service
        run: npm ci
      - name: تشغيل الاختبارات (ملفات + Postgres)
        working-directory: video-service
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/videotest
        run: npm test

  travel-service-tests:
    name: اختبارات بوابة السفر
    runs-on: ubuntu-latest
    # نفس عقيدة خدمة الفيديو: المجموعة كاملة على المخزنين (ملفات + Postgres)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traveltest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: travel-service/package-lock.json
      - name: تثبيت تبعيات بوابة السفر
        working-directory: travel-service
        run: npm ci
      - name: تشغيل الاختبارات (ملفات + Postgres)
        working-directory: travel-service
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/traveltest
        run: npm test

  logo-service-tests:
    name: اختبارات خدمة الشعارات
    runs-on: ubuntu-latest
    # نفس عقيدة الخدمتين الأخريين: المجموعة كاملة على المخزنين (ملفات + Postgres)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jalogotest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: logo-service/package-lock.json
      - name: تثبيت تبعيات خدمة الشعارات
        working-directory: logo-service
        run: npm ci
      - name: تشغيل الاختبارات (ملفات + Postgres)
        working-directory: logo-service
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jalogotest
        run: npm test

  frontend-build:
    name: بناء الواجهة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: تثبيت تبعيات الواجهة
        working-directory: frontend
        run: npm ci
      # يصطاد أخطاء الاستيراد/التصدير التي لا يراها فحص الصياغة (درس #59)
      - name: بناء إنتاجي كامل
        working-directory: frontend
        run: npm run build

  generated-admin:
    name: دخول الأدمن في القالب المولد
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: توليد قالب الاختبار
        run: node backend/scripts/testGeneratedAdmin.mjs prepare /tmp/jaola-admin-smoke
      - name: بناء Next وقاعدة SQLite
        working-directory: /tmp/jaola-admin-smoke
        run: |
          npm install --ignore-scripts
          npx prisma db push
          npm run build
      - name: اختبار الدخول والحفظ والخروج
        run: node backend/scripts/testGeneratedAdmin.mjs test /tmp/jaola-admin-smoke
