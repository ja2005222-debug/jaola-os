# 💤 يمنع خمول خدمة الفيديو على باقة Render المجانية قبل الإطلاق الفعلي
#
# Render المجاني يوقف الخدمة بعد 15 دقيقة خمول، فيتأخر أول طلب بعدها
# نحو 50 ثانية (بدء تشغيل بارد). هذا نبض دوري كل 10 دقائق يبقيها
# مستيقظة — بديل مجاني عن الترقية لباقة مدفوعة أثناء مرحلة التجربة.
#
# ⚠️ استهلاك الساعات: تشغيل مستمر يستهلك نحو 720 ساعة شهرياً من سقف
# Render المجاني (750 ساعة/شهر لكل الحساب) — كافٍ لخدمة واحدة فقط.
# إن كانت لديك خدمات مجانية أخرى تعمل بالتوازي فقد يُستنفد السقف قبل
# نهاية الشهر فتتوقف الخدمات المجانية بقية الشهر.
#
# ⚠️ توقيت غير مضمون بدقة: جدولة GitHub Actions "بأفضل جهد" وقد
# تتأخر دقائق إضافية في أوقات الضغط — إن استمر ظهور بطء 50 ثانية رغم
# هذا الملف، فبديل أدق: خدمة مجانية خارجية مثل UptimeRobot تستدعي نفس
# الرابط كل 5 دقائق.
name: نبض حياة خدمة الفيديو (Render المجاني)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    name: استدعاء مسار الصحة
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        run: curl -sf --max-time 75 https://jaola-video.onrender.com/api/health
