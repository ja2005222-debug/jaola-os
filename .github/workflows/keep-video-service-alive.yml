# 💤 نبض حياة خدمة الفيديو — ⏸️ الجدولة التلقائية **موقوفة حالياً**
#
# Render المجاني يوقف الخدمة بعد 15 دقيقة خمول، فيتأخر أول طلب بعدها
# نحو 50 ثانية (بدء تشغيل بارد). هذا النبض كان يعمل كل 10 دقائق ليبقيها
# مستيقظة — بديل مجاني عن الترقية لباقة مدفوعة أثناء مرحلة التجربة.
#
# ⏸️ لماذا أُوقفت الجدولة (أغسطس ٢٠٢٦): النبض المستمر يستهلك نحو 720
# ساعة شهرياً من سقف Render المجاني البالغ 750 ساعة **للحساب كله** — أي
# أنه يلتهم السقف وحده. ومع دخول مُطلِق بوابة السفر الزمني
# (travel-cron.yml) صار السقف مورداً مشتركاً، وبوابة السفر هي الخدمة
# النشطة بينما خدمة الفيديو ما تزال قبل الإطلاق الفعلي.
#
# الأثر المقبول: أول طلب لخدمة الفيديو بعد خمول يتأخر ~50 ثانية. لا
# تعطّل ولا فقد بيانات — تأخير بدء تشغيل بارد لا أكثر.
#
# ▶️ لإعادة تشغيله عند إطلاق خدمة الفيديو: أعِد كتلة `schedule` أدناه
#    (كانت `- cron: '*/10 * * * *'`) وتحقّق أولاً من ساعات Render
#    المتبقية، لأن travel-cron.yml صار يشاركها السقف.
#
# ⚠️ توقيت غير مضمون بدقة: جدولة GitHub Actions "بأفضل جهد" وقد
# تتأخر دقائق إضافية في أوقات الضغط — إن احتجت دقّة أعلى لاحقاً فبديل
# أدق: خدمة مجانية خارجية مثل UptimeRobot تستدعي نفس الرابط كل 5 دقائق.
name: نبض حياة خدمة الفيديو (يدوي — الجدولة موقوفة)

on:
  # الجدولة موقوفة عمداً (راجع الشرح أعلاه). التشغيل اليدوي يبقى متاحاً
  # لإيقاظ الخدمة عند الحاجة بلا إعادة تفعيل النبض المستمر.
  workflow_dispatch: {}

jobs:
  ping:
    name: استدعاء مسار الصحة
    runs-on: ubuntu-latest
    steps:
      - name: GET /api/health
        run: curl -sf --max-time 75 https://jaola-video.onrender.com/api/health
