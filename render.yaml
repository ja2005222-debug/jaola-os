# 🚀 Render Blueprint — نشر خدمة الفيديو المستقلة بنقرات معدودة
#
# ⚠️ هذا الملف لا يؤثر إطلاقاً على خدمة الباك إند الحالية المنشأة يدوياً:
# مخططات Render (Blueprints) تعمل فقط عند إنشائها صراحةً من اللوحة
# (New → Blueprint → اختيار هذا المستودع) — لا شيء يتغير تلقائياً بوجوده.
#
# خطوات النشر:
#  1. لوحة Render → New → Blueprint → اختر مستودع jaola-os.
#  2. عند الطلب، أدخل JWT_SECRET بنفس قيمة سر المنصة الرئيسية بالضبط
#     (هذا هو الدخول الموحّد) وADMIN_USERS بنفس قائمة المشرفين.
#  3. Apply — تحصل على رابط https://jaola-video.onrender.com (أو مشابه).
#
# ⚠️ الدوام: بلا DATABASE_URL تُخزَّن الأرصدة/المهام في ملفات على قرص
# مؤقت — تُمسح مع كل إعادة نشر. للدوام الحقيقي (وهو مجاني) أنشئ قاعدة
# PostgreSQL على Neon أو Supabase وأضف رابطها في DATABASE_URL أدناه؛
# تُنشأ الجداول تلقائياً عند أول إقلاع.

services:
  - type: web
    name: jaola-video
    runtime: node
    plan: free
    rootDir: video-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        sync: false # يُدخل يدوياً عند إنشاء الـ Blueprint — نفس سر المنصة حرفياً
      - key: ADMIN_USERS
        sync: false # نفس قائمة مشرفي المنصة (أسماء مفصولة بفواصل)
      - key: DATABASE_URL
        sync: false # رابط PostgreSQL (Neon/Supabase مجاناً) — بدونه التخزين مؤقت
      - key: VIDEO_PROVIDER
        value: mock # بدّلها إلى shotstack بعد فتح حساب وإضافة SHOTSTACK_API_KEY
      # 🛡️ درع التكلفة — راجع قسمه في README قبل تفعيل مزوّد مدفوع.
      # DAILY_RENDER_CAP=0 إيقاف طوارئ فوري لكل توليد جديد.
      - key: DAILY_RENDER_CAP
        value: "200"
      - key: DAILY_RENDER_CAP_PER_USER
        value: "20"
      - key: STARTER_CREDITS
        value: "3" # اجعله 0 قبل تفعيل مزوّد مدفوع (كل حساب جديد يكلفك)
      - key: COST_ALERT_WEBHOOK_URL
        sync: false # اختياري: رابط Slack/Discord يستقبل تنبيه بلوغ السقف
      # 🗃️ ملكية ملفات الفيديو (اختيارية) — بدونها تبقى لدى المزوّد.
      # فعّلها بضبط VIDEO_STORAGE=r2 مع المفاتيح الأربعة (انظر README).
      - key: VIDEO_STORAGE
        value: "" # ضع r2 بعد إنشاء الدلو والمفاتيح
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
