# 🚀 Render Blueprint — نشر خدمة الفيديو المستقلة بنقرات معدودة
#
# ⚠️ هذا الملف لا يؤثر إطلاقاً على خدمة الباك إند الحالية المنشأة يدوياً:
# مخططات Render (Blueprints) تعمل فقط عند إنشائها صراحةً من اللوحة
# (New → Blueprint → اختيار هذا المستودع) — لا شيء يتغير تلقائياً بوجوده.
#
# خطوات النشر:
#  1. لوحة Render → New → Blueprint → اختر مستودع jaola-os.
#  2. عند الطلب، أدخل JWT_SECRET بنفس قيمة سر المنصة الرئيسية بالضبط
#     (هذا هو الدخول الموحّد) وADMIN_USERS بنفس قائمة المشرفين.
#  3. Apply — تحصل على رابط https://jaola-video.onrender.com (أو مشابه).
#
# ⚠️ الدوام: بلا DATABASE_URL تُخزَّن الأرصدة/المهام في ملفات على قرص
# مؤقت — تُمسح مع كل إعادة نشر. للدوام الحقيقي (وهو مجاني) أنشئ قاعدة
# PostgreSQL على Neon أو Supabase وأضف رابطها في DATABASE_URL أدناه؛
# تُنشأ الجداول تلقائياً عند أول إقلاع.

services:
  - type: web
    name: jaola-video
    runtime: node
    plan: free
    rootDir: video-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    # ⚠️⚠️ درس إنتاجي مكلف: كل المتغيرات هنا sync: false **عمداً وبلا استثناء**.
    # أي متغير يُكتب هنا بـ value: تعيد Render فرضَه من هذا الملف عند كل
    # تعديل عليه (مزامنة الـ Blueprint)، فتمسح ما ضبطتَه يدوياً في اللوحة —
    # حدث فعلاً: تعديلٌ للملف أطفأ VIDEO_AI_PROVIDER=fal وVIDEO_STORAGE=r2
    # المضبوطين من اللوحة، فاختفى قالب الذكاء الاصطناعي وملكية الملفات.
    # القاعدة: القيم تُدار من لوحة Render حصراً، وهذا الملف يعرّف المفاتيح فقط.
    envVars:
      - key: JWT_SECRET
        sync: false # نفس سر المنصة الرئيسية حرفياً (الدخول الموحّد)
      - key: ADMIN_USERS
        sync: false # نفس قائمة مشرفي المنصة (أسماء مفصولة بفواصل)
      - key: DATABASE_URL
        sync: false # رابط PostgreSQL (Neon/Supabase مجاناً) — بدونه التخزين مؤقت
      - key: VIDEO_PROVIDER
        sync: false # mock (افتراضي) أو shotstack
      # 🤖 التوليد بالذكاء الاصطناعي (اختياري) — بدونه يُخفى قالبه.
      # ⚠️ أغلى بكثير من التركيب: راجع درع التكلفة في README قبل تفعيله.
      - key: VIDEO_AI_PROVIDER
        sync: false # ضع fal (من اللوحة) بعد إضافة FAL_KEY
      - key: FAL_KEY
        sync: false
      - key: FAL_MODEL
        sync: false # اختياري منذ كتالوج النماذج — يضبط الافتراضي فقط
      - key: FAL_MODELS_JSON
        sync: false # اختياري: توسيع كتالوج النماذج بلا نشر (انظر README)
      # 🛡️ درع التكلفة — راجع قسمه في README قبل تفعيل مزوّد مدفوع.
      # DAILY_RENDER_CAP=0 إيقاف طوارئ فوري لكل توليد جديد.
      - key: DAILY_RENDER_CAP
        sync: false # افتراضي الكود 200
      - key: DAILY_RENDER_CAP_PER_USER
        sync: false # افتراضي الكود 20
      - key: STARTER_CREDITS
        sync: false # افتراضي الكود 3 — اجعله 0 قبل تفعيل مزوّد مدفوع
      - key: COST_ALERT_WEBHOOK_URL
        sync: false # اختياري: رابط Slack/Discord يستقبل تنبيه بلوغ السقف
      # 🗃️ ملكية ملفات الفيديو (اختيارية) — بدونها تبقى لدى المزوّد.
      # فعّلها بضبط VIDEO_STORAGE=r2 مع المفاتيح الأربعة (انظر README).
      - key: VIDEO_STORAGE
        sync: false # ضع r2 (من اللوحة) بعد إنشاء الدلو والمفاتيح
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
