<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 🌐 نفس قرار index.html: الصفحة مترجَمة يدوياً بأربع لغات، وترجمة
       المتصفح الآلية فوقها تُفسِدها («Van» → «By») — فنعلنها مترجمة. -->
  <meta name="google" content="notranslate" />
  <title>من نحن · الشروط · الخصوصية · الاسترجاع — Jatrava</title>
  <meta name="description" content="من نحن، بيانات التواصل، الشروط والأحكام، سياسة الخصوصية، وسياسة الاسترجاع والإلغاء لدى Jatrava." />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#f4f6f8" />
  <style>
    :root {
      --bg: #eef2f7; --card: #ffffff; --border: #ccd7e5;
      --text: #1b222d; --muted: #4a5768; --accent: #2450b8;
      --accent-soft: #e8effc; --accent-deep: #1a3d8f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, 'Noto Sans Arabic',
        'Dubai', Tahoma, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      font-size: 16px; line-height: 1.75;
    }
    a { color: var(--accent); }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--card); flex-wrap: wrap;
    }
    header a.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .brand-logo { height: 40px; width: auto; display: block; }
    header .sub { color: var(--muted); font-size: 13px; font-weight: 600; }
    #langBtn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 12px; border-radius: 999px; font-size: 13px; cursor: pointer;
      font-family: inherit;
    }
    #langBtn:hover { border-color: var(--accent); color: var(--accent); }
    main { max-width: 820px; margin: 0 auto; padding: 24px 20px 60px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tabs button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: 14px; font-weight: 600;
      font-family: inherit;
    }
    .tabs button.active {
      border-color: var(--accent); color: var(--accent-deep); background: var(--accent-soft);
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 24px; box-shadow: 0 1px 3px rgba(15,23,42,.07);
    }
    .card h2 { font-size: 21px; margin-bottom: 14px; }
    .card h3 { font-size: 16px; margin: 18px 0 6px; color: var(--accent-deep); }
    .card p, .card li { color: var(--text); font-size: 15px; }
    .card p { margin-bottom: 10px; }
    .card ul { margin: 6px 0 10px; padding-inline-start: 22px; }
    .card li { margin-bottom: 6px; }
    .biz-box {
      background: var(--accent-soft); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin: 14px 0; font-size: 14px;
    }
    .biz-box dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; }
    .biz-box dt { color: var(--muted); font-weight: 600; white-space: nowrap; }
    .biz-box dd { color: var(--text); }
    .updated { color: var(--muted); font-size: 13px; margin-top: 18px; }
    footer.back { max-width: 820px; margin: 0 auto; padding: 0 20px 40px; }
    footer.back a { font-size: 14px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/">
      <img src="/logo.svg" alt="Jatrava" class="brand-logo" width="1626" height="442">
      <span class="sub" id="brandSub">بوابة السفر</span>
    </a>
    <select id="langBtn" title="اللغة / Language / زبان / Taal">
      <option value="ar">العربية</option>
      <option value="en">English</option>
      <option value="ur">اردو</option>
      <option value="nl">Nederlands</option>
    </select>
  </header>

  <main>
    <div class="tabs" id="tabs"></div>
    <div class="card" id="content"></div>
    <div class="updated" id="updated"></div>
  </main>
  <footer class="back"><a href="/" id="backLink">← العودة إلى بوابة السفر</a></footer>

  <script>
    /**
     * 📜 legal.html — صفحةٌ ذاتية الاحتواء (بلا إطار عمل) لخمسة أقسام
     * قانونية/تعريفية: من نحن، اتصل بنا، الشروط، الخصوصية، الاسترجاع.
     *
     * لماذا صفحة منفصلة بترجمة داخلية خاصة بها لا جدول i18n.js الكبير؟
     * جدول index.html مصمَّم لمطابقة نصوص **ثابتة** حرفياً (حارس انجراف
     * صارم يربط كل مفتاح بنص في تلك الصفحة تحديداً) — محتوى قانوني طويل
     * ومتغيّر أنسب له نمط `T(ar, en, ur, nl)` المستقل، وهو تعميم نفس
     * النمط الثنائي المستعمل أصلاً في share.html.
     *
     * اللغة تصل عبر `?lang=` من روابط ذيل index.html (الصفحة ثابتة —
     * لا يستبدل الخادم وسم `<html>` هنا كما يفعل للصفحة الرئيسية).
     *
     * ⚠️ الأردية والهولندية مترجمتان آلياً (LLM) بلا مراجعة متحدثٍ أصلي —
     * كما وثّقت الميزة 36 في CLAUDE.md، تستحق الشروط والخصوصية مراجعةً
     * بشرية قبل الاعتماد القانوني الكامل بهاتين اللغتين.
     *
     * البيانات هنا حقيقية من السجل التجاري الهولندي (KVK) — لا نص تجريبي.
     */
    const $ = id => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    const qsLang = qs.get('lang');
    let lang = ['en', 'ur', 'nl'].includes(qsLang) ? qsLang : 'ar';
    const T = (ar, en, ur, nl) => ({ ar, en, ur, nl })[lang];
    const LANG_DIR = { ar: 'rtl', en: 'ltr', ur: 'rtl', nl: 'ltr' };
    const LANG_HOME = { ar: '/', en: '/en/', ur: '/ur/', nl: '/nl/' };

    const BIZ = {
      name: 'JaTrava',
      legalName: 'Nalia Diensten',
      kvk: '71937633',
      established: '22-06-2018',
      address: 'Lodewijk Napoleonplantsoen 82, 3582TX Utrecht, Netherlands',
      sbi: '79110',
      email: 'support@jatrava.com',
    };

    function bizBox() {
      return `<div class="biz-box"><dl>
        <dt>${T('الاسم التجاري', 'Trading name', 'تجارتی نام', 'Handelsnaam')}</dt><dd>${BIZ.name}</dd>
        <dt>${T('المنشأة المسجَّلة', 'Registered entity', 'رجسٹرڈ ادارہ', 'Geregistreerde onderneming')}</dt><dd>${BIZ.legalName} (${T('منشأة فردية', 'sole proprietorship', 'انفرادی ملکیت', 'eenmanszaak')})</dd>
        <dt>${T('السجل التجاري (KVK)', 'Chamber of Commerce (KVK)', 'چیمبر آف کامرس (KVK)', 'Kamer van Koophandel (KVK)')}</dt><dd>${BIZ.kvk}</dd>
        <dt>${T('تاريخ التأسيس', 'Established', 'قیام', 'Opgericht')}</dt><dd>${BIZ.established}</dd>
        <dt>${T('العنوان المسجَّل', 'Registered address', 'رجسٹرڈ پتہ', 'Geregistreerd adres')}</dt><dd>${BIZ.address}</dd>
        <dt>${T('تصنيف النشاط (SBI)', 'Activity code (SBI)', 'سرگرمی کوڈ (SBI)', 'SBI-code')}</dt><dd>${BIZ.sbi} — ${T('وكالة سفر', 'travel agency', 'ٹریول ایجنسی', 'reisbureau')}</dd>
        <dt>${T('البريد الإلكتروني', 'Email', 'ای میل', 'E-mail')}</dt><dd><a href="mailto:${BIZ.email}">${BIZ.email}</a></dd>
      </dl></div>`;
    }

    const TABS = [
      { id: 'about', ar: 'من نحن', en: 'About us', ur: 'ہمارے بارے میں', nl: 'Over ons' },
      { id: 'contact', ar: 'اتصل بنا', en: 'Contact', ur: 'ہم سے رابطہ کریں', nl: 'Contact' },
      { id: 'terms', ar: 'الشروط والأحكام', en: 'Terms & Conditions', ur: 'شرائط و ضوابط', nl: 'Algemene voorwaarden' },
      { id: 'privacy', ar: 'سياسة الخصوصية', en: 'Privacy Policy', ur: 'رازداری کی پالیسی', nl: 'Privacybeleid' },
      { id: 'refund', ar: 'الاسترجاع والإلغاء', en: 'Refunds & Cancellations', ur: 'واپسی اور منسوخی', nl: 'Restituties & annuleringen' },
    ];
    const tabLabel = t => T(t.ar, t.en, t.ur, t.nl);

    function renderAbout() {
      return `<h2>${T('🏢 من نحن', '🏢 About us', '🏢 ہمارے بارے میں', '🏢 Over ons')}</h2>
        <p>${T(
          'Jatrava بوابة سفرٍ رقمية تتيح حجز الطيران والفنادق والسيارات والباقات السياحية بأسعارٍ شفافة — نحن البائع المباشر لا مجرّد وسيط: نشتري صافياً من شركائنا (Duffel وLiteAPI) ونبيع بسعرٍ نهائي واحد بلا رسوم مفاجئة بعد الحجز.',
          'Jatrava is a digital travel portal for booking flights, hotels, cars and travel packages with transparent pricing. We act as the direct seller of record, not a mere intermediary: we buy net fares from our partners (Duffel and LiteAPI) and sell at one final price, with no surprise fees after booking.',
          'Jatrava ایک ڈیجیٹل سفری پورٹل ہے جہاں آپ پروازیں، ہوٹل، گاڑیاں اور سیاحتی پیکجز شفاف قیمتوں پر بک کر سکتے ہیں — ہم براہِ راست فروخت کنندہ ہیں، محض ثالث نہیں: ہم اپنے شراکت داروں (Duffel اور LiteAPI) سے خالص قیمت پر خریدتے ہیں اور ایک حتمی قیمت پر بیچتے ہیں، بکنگ کے بعد کوئی اچانک فیس نہیں۔',
          'Jatrava is een digitaal reisportaal voor het boeken van vluchten, hotels, auto’s en reispakketten met transparante prijzen. Wij treden op als directe verkoper, niet als tussenpersoon: we kopen nettotarieven in bij onze partners (Duffel en LiteAPI) en verkopen tegen één definitieve prijs, zonder verrassingskosten na de boeking.'
        )}</p>
        <p>${T(
          'الخدمة تشغّلها وتملكها منشأة Nalia Diensten، وهي منشأةٌ فردية (Eenmanszaak) مسجَّلة رسمياً في السجل التجاري الهولندي (Kamer van Koophandel) تحت النشاط التجاري «JaTrava»، ومسجَّلة تحديداً كوكالة سفر (تصنيف SBI رقم 79110).',
          'The service is operated and owned by Nalia Diensten, a sole proprietorship (Eenmanszaak) officially registered with the Dutch Chamber of Commerce (Kamer van Koophandel) under the trade name “JaTrava”, specifically registered as a travel agency (SBI code 79110).',
          'یہ سروس Nalia Diensten کی ملکیت ہے اور اسی کے زیرِ انتظام چلتی ہے — ایک انفرادی ملکیت (Eenmanszaak) جو ڈچ چیمبر آف کامرس (Kamer van Koophandel) میں تجارتی نام «JaTrava» کے تحت باضابطہ رجسٹرڈ ہے، اور خاص طور پر ٹریول ایجنسی (SBI کوڈ 79110) کے طور پر درج ہے۔',
          'De dienst wordt geëxploiteerd en is eigendom van Nalia Diensten, een eenmanszaak die officieel is ingeschreven bij de Kamer van Koophandel onder de handelsnaam “JaTrava”, specifiek geregistreerd als reisbureau (SBI-code 79110).'
        )}</p>
        <h3>${T('بيانات التسجيل الرسمية', 'Official registration details', 'سرکاری رجسٹریشن کی تفصیلات', 'Officiële registratiegegevens')}</h3>
        ${bizBox()}`;
    }

    function renderContact() {
      return `<h2>${T('✉️ اتصل بنا', '✉️ Contact us', '✉️ ہم سے رابطہ کریں', '✉️ Contact')}</h2>
        <p>${T(
          'لأي استفسار عن حجزٍ قائم، أو مشكلة في الدفع، أو طلب تعديل أو استرداد، أو أي سؤال آخر — راسلنا على البريد التالي وسنرد عليك في أقرب وقت ممكن:',
          'For any question about an existing booking, a payment issue, a change or refund request, or anything else — email us at the address below and we will get back to you as soon as possible:',
          'کسی موجودہ بکنگ، ادائیگی کے مسئلے، تبدیلی یا ریفنڈ کی درخواست، یا کسی بھی اور سوال کے لیے — نیچے دیے گئے ای میل پر ہمیں لکھیں، ہم جلد از جلد جواب دیں گے:',
          'Voor vragen over een bestaande boeking, een betalingsprobleem, een wijzigings- of restitutieverzoek, of iets anders — mail ons op onderstaand adres en we nemen zo snel mogelijk contact met u op:'
        )}</p>
        <p style="font-size:20px;font-weight:700"><a href="mailto:${BIZ.email}">${BIZ.email}</a></p>
        <p>${T(
          'يمكنك أيضاً استخدام «المساعد» أو نموذج التواصل داخل بوابة رحلاتي (My trips) لمن لديه حساب — تصل رسالتك مباشرةً مرتبطةً بحجزك.',
          'If you have an account, you can also use the in-app assistant or the contact option inside My trips — your message reaches us linked directly to your booking.',
          'اگر آپ کا اکاؤنٹ ہے تو آپ «میرے سفر» کے اندر اسسٹنٹ یا رابطہ آپشن بھی استعمال کر سکتے ہیں — آپ کا پیغام براہِ راست آپ کی بکنگ سے منسلک ہو کر ہم تک پہنچتا ہے۔',
          'Als u een account heeft, kunt u ook de assistent of de contactoptie binnen «Mijn reizen» gebruiken — uw bericht bereikt ons direct gekoppeld aan uw boeking.'
        )}</p>
        <h3>${T('العنوان المسجَّل', 'Registered address', 'رجسٹرڈ پتہ', 'Geregistreerd adres')}</h3>
        <p>Nalia Diensten (JaTrava)<br>${BIZ.address}</p>
        <h3>${T('السجل التجاري', 'Business registration', 'کاروباری رجسٹریشن', 'Bedrijfsregistratie')}</h3>
        <p>KVK ${BIZ.kvk}</p>`;
    }

    function renderTerms() {
      return `<h2>${T('📄 الشروط والأحكام', '📄 Terms & Conditions', '📄 شرائط و ضوابط', '📄 Algemene voorwaarden')}</h2>
        <p>${T('باستخدامك موقع Jatrava أو حجزك عبره، فإنك توافق على الشروط التالية.',
          'By using the Jatrava website or booking through it, you agree to the following terms.',
          'Jatrava کی ویب سائٹ استعمال کرنے یا اس کے ذریعے بکنگ کرنے سے آپ درج ذیل شرائط سے اتفاق کرتے ہیں۔',
          'Door de website van Jatrava te gebruiken of erdoor te boeken, gaat u akkoord met de volgende voorwaarden.')}</p>

        <h3>${T('1. طبيعة الخدمة', '1. Nature of the service', '1. سروس کی نوعیت', '1. Aard van de dienst')}</h3>
        <p>${T(
          'Jatrava (المُشغَّلة من قِبل Nalia Diensten) تبيع خدمات سفر (طيران، فنادق، سيارات، وباقات) بصفتها البائع المباشر، معتمدةً على مزوّدين متخصصين (شركات طيران، فنادق، ومزوّدي أنظمة حجز مثل Duffel وLiteAPI) لتنفيذ الحجز فعلياً. السعر المعروض نهائي ويشمل هامش الخدمة، ولا رسوم إضافية تُضاف بعد إتمام الحجز.',
          'Jatrava (operated by Nalia Diensten) sells travel services (flights, hotels, cars, and packages) as the direct seller of record, relying on specialised suppliers (airlines, hotels, and booking infrastructure providers such as Duffel and LiteAPI) to actually fulfil each booking. The displayed price is final and includes our service margin — no extra fees are added after the booking is confirmed.',
          'Jatrava (جسے Nalia Diensten چلاتی ہے) سفری خدمات (پروازیں، ہوٹل، گاڑیاں اور پیکجز) براہِ راست فروخت کنندہ کی حیثیت سے بیچتی ہے، اور ہر بکنگ کی عملی تکمیل کے لیے متخصص فراہم کنندگان (ایئرلائنز، ہوٹل، اور Duffel و LiteAPI جیسے بکنگ انفراسٹرکچر فراہم کنندگان) پر انحصار کرتی ہے۔ دکھائی گئی قیمت حتمی ہے اور اس میں ہمارا سروس مارجن شامل ہے — بکنگ کی تصدیق کے بعد کوئی اضافی فیس نہیں لی جاتی۔',
          'Jatrava (geëxploiteerd door Nalia Diensten) verkoopt reisdiensten (vluchten, hotels, auto’s en pakketten) als directe verkoper en vertrouwt op gespecialiseerde leveranciers (luchtvaartmaatschappijen, hotels en aanbieders van boekingsinfrastructuur zoals Duffel en LiteAPI) om elke boeking daadwerkelijk uit te voeren. De getoonde prijs is definitief en omvat onze servicemarge — na bevestiging van de boeking worden geen extra kosten toegevoegd.'
        )}</p>

        <h3>${T('2. الحسابات', '2. Accounts', '2. اکاؤنٹس', '2. Accounts')}</h3>
        <p>${T(
          'التصفّح والبحث عن الأسعار متاحان بلا حساب. إنشاء حجزٍ يتطلب حساباً (بريد وكلمة مرور، أو الدخول بحساب جوجل) لضمان تواصلٍ صحيح بخصوص حجزك. أنت مسؤول عن دقّة البيانات التي تُدخلها وعن سرّية كلمة مرورك.',
          'Browsing and searching prices requires no account. Creating a booking requires an account (email and password, or Google sign-in) to ensure we can reach you about your booking. You are responsible for the accuracy of the information you provide and for keeping your password confidential.',
          'براؤزنگ اور قیمتوں کی تلاش کے لیے اکاؤنٹ درکار نہیں۔ بکنگ کرنے کے لیے اکاؤنٹ ضروری ہے (ای میل اور پاس ورڈ، یا گوگل سائن اِن) تاکہ ہم آپ کی بکنگ کے بارے میں آپ سے رابطہ کر سکیں۔ آپ اپنی فراہم کردہ معلومات کی درستی اور اپنے پاس ورڈ کی رازداری کے ذمہ دار ہیں۔',
          'Zoeken en prijzen bekijken kan zonder account. Voor het maken van een boeking is een account nodig (e-mail en wachtwoord, of inloggen met Google), zodat we u over uw boeking kunnen bereiken. U bent verantwoordelijk voor de juistheid van de door u verstrekte gegevens en voor de vertrouwelijkheid van uw wachtwoord.'
        )}</p>

        <h3>${T('3. الحجز والدفع', '3. Booking and payment', '3. بکنگ اور ادائیگی', '3. Boeken en betalen')}</h3>
        <p>${T(
          'يُدفَع ثمن الحجز إلكترونياً عبر مزوّد الدفع Stripe؛ لا نخزّن بيانات بطاقتك على خوادمنا. لبعض الباقات المجدولة يمكن دفع عربونٍ والباقي لاحقاً قبل موعدٍ محدَّد يظهر عند الحجز. يُعتبر الحجز مؤكَّداً فقط بعد استلام تأكيدٍ صريح من الخدمة (مرجع حجز/تذكرة).',
          'Booking payment is processed electronically via Stripe; we do not store your card details on our servers. Certain scheduled packages allow paying a deposit with the balance due by a specified date shown at booking time. A booking is confirmed only once you receive an explicit confirmation from the service (a booking reference/ticket).',

        )}</p>
        <p>${T(
          'إلغاء حجزٍ يجري من صفحة «رحلاتي» بزر الإلغاء المتاح، ما دام المزوّد يسمح بذلك. المبلغ المُسترَد يعتمد على ما يردّه المزوّد فعلياً: رد كامل من المزوّد ⇐ رد كامل لك، ورد جزئي ⇐ نفس النسبة، وإن التزمنا بإلغاءٍ مجاني ولم يوضّح المزوّد مبلغاً فيُرد المبلغ كاملاً. المعالجة تتم عبر Stripe وتظهر عادةً خلال أيام العمل التالية بحسب سياسة البنك المُصدِر لبطاقتك.',
          'Cancellation is done from the “My trips” page via the available cancel button, as long as the supplier allows it. The refunded amount depends on what the supplier actually refunds: a full supplier refund means a full refund to you, a partial one means the same proportion, and if we have committed to a free cancellation and the supplier does not specify an amount, a full refund is issued. Processing goes through Stripe and typically appears within the following business days, depending on your card issuer’s policy.',
          'بکنگ کی منسوخی «میرے سفر» کے صفحے سے دستیاب منسوخی کے بٹن کے ذریعے ہوتی ہے، جب تک فراہم کنندہ اس کی اجازت دے۔ واپس ہونے والی رقم اس پر منحصر ہے جو فراہم کنندہ حقیقتاً واپس کرے: فراہم کنندہ کا مکمل ریفنڈ ⇐ آپ کو مکمل ریفنڈ، جزوی ⇐ اسی تناسب سے، اور اگر ہم نے مفت منسوخی کا وعدہ کیا ہو اور فراہم کنندہ رقم واضح نہ کرے تو پوری رقم واپس کی جاتی ہے۔ پروسیسنگ Stripe کے ذریعے ہوتی ہے اور عام طور پر اگلے کاروباری دنوں میں، آپ کے کارڈ جاری کرنے والے بینک کی پالیسی کے مطابق، ظاہر ہو جاتی ہے۔',
          'Annuleren doet u vanaf de pagina «Mijn reizen» via de beschikbare annuleerknop, zolang de leverancier dat toestaat. Het terugbetaalde bedrag hangt af van wat de leverancier daadwerkelijk terugbetaalt: een volledige restitutie van de leverancier betekent een volledige terugbetaling aan u, een gedeeltelijke dezelfde verhouding, en als wij gratis annulering hebben toegezegd terwijl de leverancier geen bedrag specificeert, wordt het volledige bedrag terugbetaald. De verwerking loopt via Stripe en is doorgaans binnen de volgende werkdagen zichtbaar, afhankelijk van het beleid van uw kaartuitgever.'
        )}</p>

        <h3>${T('الباقات المجدولة (بعربون)', 'Scheduled packages (deposit-based)', 'شیڈول شدہ پیکجز (بیعانے کے ساتھ)', 'Geplande pakketten (met aanbetaling)')}</h3>
        <p>${T(
          'لبعض الباقات المجدولة يُدفَع عربونٌ عند الحجز والمتبقي قبل موعد تسليم الأسماء للناقل/الفندق (يظهر تاريخه صراحةً عند الحجز). الإلغاء الذاتي متاحٌ حتى ذلك الموعد باسترداد المبلغ المدفوع فعلياً؛ بعده يخضع الإلغاء لسياسة الباقة المحدَّدة والتي تُعرض عند الحجز.',
          'For some scheduled packages a deposit is paid at booking time, with the balance due before the names-submission deadline to the airline/hotel (its date is shown explicitly at booking time). Self-service cancellation is available up to that deadline with a refund of the amount actually paid; after it, cancellation follows the specific package policy shown at booking time.',
          'بعض شیڈول شدہ پیکجز میں بکنگ کے وقت بیعانہ ادا کیا جاتا ہے اور بقیہ رقم ناقل/ہوٹل کو نام جمع کرانے کی آخری تاریخ سے پہلے (جو بکنگ کے وقت صراحتاً دکھائی جاتی ہے)۔ اس تاریخ تک خود منسوخی ممکن ہے اور حقیقتاً ادا شدہ رقم واپس ملتی ہے؛ اس کے بعد منسوخی اس پیکج کی مخصوص پالیسی کے تابع ہے جو بکنگ کے وقت دکھائی جاتی ہے۔',
          'Bij sommige geplande pakketten betaalt u bij het boeken een aanbetaling en het restant vóór de deadline voor het doorgeven van de namen aan de maatschappij/het hotel (die datum wordt bij het boeken expliciet getoond). Tot die deadline kunt u zelf annuleren met terugbetaling van het daadwerkelijk betaalde bedrag; daarna volgt annulering het specifieke pakketbeleid dat bij het boeken werd getoond.'
        )}</p>

        <h3>${T('استئناف دفعٍ فاشل أو منتهي المهلة', 'Failed or expired payment sessions', 'ناکام یا میعاد ختم شدہ ادائیگی', 'Mislukte of verlopen betaalsessies')}</h3>
        <p>${T(
          'إن انتهت مهلة صفحة الدفع أو فشلت المعاملة بعد أن حجزنا لك مقعداً/مخزوناً مؤقتاً، يُحرَّر المخزون تلقائياً ولا يُخصَم منك أي مبلغ. يمكنك استئناف الدفع أو إعادة البحث من صفحة «رحلاتي».',
          'If the payment page times out or the transaction fails after we temporarily held a seat/inventory for you, that hold is released automatically and you are not charged. You can resume payment or search again from “My trips”.',
          'اگر ادائیگی کے صفحے کی میعاد ختم ہو جائے یا لین دین ناکام ہو جبکہ ہم نے عارضی طور پر آپ کے لیے نشست/انوینٹری روک رکھی ہو، تو وہ ہولڈ خودکار طور پر آزاد ہو جاتی ہے اور آپ سے کوئی رقم نہیں لی جاتی۔ آپ «میرے سفر» سے ادائیگی دوبارہ شروع کر سکتے ہیں یا نئی تلاش کر سکتے ہیں۔',
          'Als de betaalpagina verloopt of de transactie mislukt nadat we tijdelijk een stoel/voorraad voor u hadden vastgehouden, wordt die reservering automatisch vrijgegeven en wordt er niets bij u in rekening gebracht. U kunt de betaling hervatten of opnieuw zoeken vanaf «Mijn reizen».'
        )}</p>

        <h3>${T('كيف تطلب استرداداً', 'How to request a refund', 'ریفنڈ کی درخواست کیسے کریں', 'Zo vraagt u een restitutie aan')}</h3>
        <p>${T(
          'من صفحة «رحلاتي» عبر زر الإلغاء المتاح على حجزك، أو بمراسلتنا على البريد أدناه مع ذكر مرجع الحجز.',
          'From “My trips” via the cancel button available on your booking, or by emailing us at the address below with your booking reference.',
          '«میرے سفر» کے صفحے سے اپنی بکنگ پر دستیاب منسوخی کے بٹن کے ذریعے، یا بکنگ ریفرنس کے ساتھ نیچے دیے گئے ای میل پر ہمیں لکھ کر۔',
          'Vanaf de pagina «Mijn reizen» via de annuleerknop op uw boeking, of door ons te mailen op onderstaand adres met vermelding van uw boekingsreferentie.'
        )}</p>
        <p><a href="mailto:${BIZ.email}">${BIZ.email}</a></p>`;
    }

    const RENDERERS = { about: renderAbout, contact: renderContact, terms: renderTerms, privacy: renderPrivacy, refund: renderRefund };

    function currentTab() {
      const h = location.hash.replace('#', '');
      return RENDERERS[h] ? h : 'about';
    }

    function renderTabs(active) {
      $('tabs').innerHTML = TABS.map(t =>
        `<button data-tab="${t.id}" class="${t.id === active ? 'active' : ''}">${tabLabel(t)}</button>`
      ).join('');
      $('tabs').querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => { location.hash = btn.dataset.tab; });
      });
    }

    function renderPage() {
      const tab = currentTab();
      renderTabs(tab);
      $('content').innerHTML = RENDERERS[tab]();
      $('updated').textContent = T('آخر تحديث: أغسطس 2026', 'Last updated: August 2026', 'آخری اپ ڈیٹ: اگست 2026', 'Laatst bijgewerkt: augustus 2026');
      document.title = `${tabLabel(TABS.find(t => t.id === tab))} — Jatrava`;
    }

    function applyLangChrome() {
      document.documentElement.lang = lang;
      document.documentElement.dir = LANG_DIR[lang];
      $('langBtn').value = lang;
      $('brandSub').textContent = T('بوابة السفر', 'Travel Portal', 'سفری پورٹل', 'Reisportaal');
      // العودة والشعار يقودان إلى جذر **نفس اللغة** — لا الجذر العربي دوماً
      document.querySelector('a.brand').href = LANG_HOME[lang];
      const back = $('backLink');
      back.href = LANG_HOME[lang];
      back.textContent = T('← العودة إلى بوابة السفر', '← Back to the travel portal', '← سفری پورٹل پر واپس', '← Terug naar het reisportaal');
    }

    $('langBtn').addEventListener('change', () => {
      lang = $('langBtn').value;
      const url = new URL(location.href);
      if (lang === 'ar') url.searchParams.delete('lang'); else url.searchParams.set('lang', lang);
      history.replaceState(null, '', url);
      applyLangChrome();
      renderPage();
    });
    window.addEventListener('hashchange', renderPage);

    applyLangChrome();
    renderPage();
  </script>
</body>
</html>
