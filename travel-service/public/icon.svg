<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6fd4"/>
      <stop offset="1" stop-color="#1e4fa8"/>
    </linearGradient>
    <clipPath id="globeClip">
      <circle cx="220" cy="300" r="148"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="#f4f6f8"/>

  <!-- الكرة الأرضية: حدّها وخط طول وخط استواء فقط — تبقى واضحة بحجم صغير
       (favicon/تبويب المتصفح 16-32px) -->
  <g fill="none" stroke="url(#g)" stroke-width="11">
    <circle cx="220" cy="300" r="148"/>
    <ellipse cx="220" cy="300" rx="52" ry="148"/>
    <line x1="72" y1="300" x2="368" y2="300"/>
  </g>

  <!-- سلسلة جبال أسفل الكرة -->
  <g clip-path="url(#globeClip)">
    <path fill="url(#g)" opacity="0.92"
      d="M46 392 L128 316 L176 354 L232 288 L300 360 L366 332 L400 352 L400 460 L46 460 Z"/>
  </g>

  <!-- أثر الطائرة فوق الكرة -->
  <path fill="none" stroke="url(#g)" stroke-width="15" stroke-linecap="round"
    d="M104 214 C 186 128, 288 104, 352 122"/>

  <!-- طائرة ورقية بسيطة: جسم + طيّة جناح -->
  <g transform="translate(348 68) rotate(28)">
    <path fill="url(#g)" d="M0 40 L150 0 L46 66 L30 46 Z"/>
    <path fill="#1e4fa8" opacity="0.85" d="M46 66 L74 84 L30 46 Z"/>
  </g>

  <!-- نقطة البوصلة -->
  <circle cx="452" cy="94" r="18" fill="#b45309"/>
</svg>
