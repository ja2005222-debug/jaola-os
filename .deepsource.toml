version = 1

# ⚙️ إعداد DeepSource (إعداد المحلّلات لا يتوفر في لوحة DeepSource — عبر
# هذا الملف حصراً).
#
# 📌 سجل تجربة موثَّق حتى لا يعيدها أحد: محلّل JavaScript كان يفشل بخطأ
# JS-0833 "'import' and 'export' may appear only with 'sourceType: module'"
# على كل ملفات ESM في المستودع (backend/ وvideo-service/) رغم أن
# package.json يعلن "type": "module".
# ضبط module_system = "es-modules" أدناه **لم يحل المشكلة** — جُرّب
# ودُمج في main وأُعيد التحليل، وبقي الخطأ كما هو. الحل الفعلي كان
# تجاهل القاعدة JS-0833 على مستوى المستودع من
# Settings → Ignore rules، لأنها ليست عيباً في الكود بل عجز المحلّل
# عن قراءة ESM (نفس الملفات تمر عبر ٧٩٣ اختباراً وبناء إنتاجي ناجح).
# أُبقي المفتاح هنا لأنه صحيح المعنى وقد يعمل في نسخة محلّل لاحقة، لكن
# لا يُعتمد عليه.
#
# ⚠️ وجود هذا الملف ينقل الإعداد من اللوحة إليه، فأي محلّل غير مذكور
# هنا يتوقف. لذلك أُدرجت **كل** المحلّلات التي كانت فعّالة وناجحة قبل
# إضافته — وتم التحقق تجريبياً بعد الدمج أن أياً منها لم يسقط.

[[analyzers]]
name = "javascript"

  [analyzers.meta]
  # es-modules: السبب المباشر لإضافة هذا الملف (backend/frontend/video-service كلها ESM)
  module_system = "es-modules"
  # nodejs للخادم وخدمة الفيديو، browser للواجهة — كلاهما في هذا المستودع
  environment = ["nodejs", "browser"]
  # الواجهة React
  plugins = ["react"]

[[analyzers]]
name = "secrets"

[[analyzers]]
name = "shell"

[[analyzers]]
name = "docker"

[[analyzers]]
name = "sql"

[[analyzers]]
name = "python"

[[analyzers]]
name = "java"

[[analyzers]]
name = "cxx"

# ملفات الاختبار تُعامَل كاختبارات لا كود إنتاج (قواعد أخف، بلا إنذارات
# في غير محلها مثل "قيمة ثابتة مكررة" في بيانات اختبار).
#
# 📌 سجل ثانٍ: كان `travel-service/tests` **ناقصاً** من هذه القائمة —
# سهوٌ حين نمت الخدمة بعد كتابة الملف. فلمّا أضيفت اختبارات الحسابات
# (تسجيل/دخول) أوقف محلّل secrets الدمجَ على كلمات مرور اختبارية حرفية
# مثل `password: 'travel2026x'`: يراها اعتماداً في **كود إنتاج** لأن
# الملف لم يكن معرَّفاً كاختبار. وهي بيانات تجربة لا سرّ.
# الإضافة هنا ليست إسكاتاً لتحذير، بل إكمالُ سياسةٍ قائمة وموثَّقة
# أعلاه كانت تشمل نظيرتيها في backend وvideo-service.
test_patterns = [
  "backend/tests/**",
  "video-service/tests/**",
  "travel-service/tests/**",
]

exclude_patterns = [
  "**/node_modules/**",
  "frontend/dist/**",
  "workspace/**",
]
