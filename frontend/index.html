<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      🎙️ مسجّل الأخطاء المبكّر — يسبق كل سكربت آخر عمداً.

      ⚠️ درس (٢٥ أغسطس ٢٠٢٦): حارس الإقلاع أسفل الصفحة كان يرشّح أحداث
      window.error إلى **فشل تحميل السكربتات** وحدها، فإن نُفِّذت الحزمة
      ورمت خطأً عند أعلى مستواها ضاعت الرسالة، وقالت البطاقة «راجع Console»
      بدل أن تسمّي العطب. على jaola.dev وصلت الحزمة بـ200 وبنوع محتوى سليم
      ولم يُرسم شيء — وهي بالضبط هذه الحالة.
      هنا نلتقط **كل** خطأ غير مُلتقَط ورفضٍ غير معالَج ونحتفظ بأوّله، ليعرضه
      الحارس في البطاقة. أوّل خطأ هو المهم: ما بعده غالباً تبعات له.
    -->
    <script>
      window.__jaolaErrors = [];
      window.addEventListener('error', function (e) {
        var t = e && e.target;
        if (t && t !== window && t.tagName) {         // فشل تحميل مورد
          window.__jaolaErrors.push('load-failed: ' + (t.src || t.href || t.tagName));
        } else if (e && e.message) {                   // استثناء غير مُلتقَط
          window.__jaolaErrors.push(e.message
            + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno : ''));
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        window.__jaolaErrors.push('unhandled rejection: '
          + (r && r.message ? r.message : String(r)));
      });
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#030508" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JAOLA OS" />
    <title>JAOLA OS — ابنِ موقعك بالذكاء الاصطناعي | Build your website with AI</title>
    <meta name="description" content="صف ما تريده بجملة عادية، وJAOLA يبنيه لك موقعاً حقيقياً وينشره — بمساعد ذكي، صندوق رسائل، وأدوات تسويق مدمجة. Describe what you want in plain words — JAOLA builds and publishes a real website, with a site assistant, an inbox, and marketing tools built in.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="JAOLA OS — ابنِ موقعك بالذكاء الاصطناعي">
    <meta property="og:description" content="من فكرة إلى موقع حقيقي منشور — بفريق ذكاء اصطناعي كامل.">
    <meta name="twitter:card" content="summary_large_image">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!--
      🩺 حارس الإقلاع — آخر خط دفاع، **خارج الحزمة عمداً**.

      ⚠️ درس مدفوع الثمن (٢٥ أغسطس ٢٠٢٦): أُضيف حدّ أخطاء React (ErrorBoundary)
      لعلاج «صفحة بيضاء فقط» على jaola.dev، فبقيت الصفحة بيضاء **بلا بطاقة خطأ**
      بعد النشر. والسبب أن حدّ الأخطاء يعيش داخل حزمة الدخول نفسها: إن فشلت
      الحزمة في التحميل أو التنفيذ فلا شيء من React يعمل أصلاً — لا حدّ أخطاء
      ولا بطاقة ولا رسالة. فالبياض الصامت يبقى صامتاً.

      هذا السكربت **عادي لا وحدة (no module)** ومضمّن في الـHTML، فيعمل دائماً
      حتى لو لم تُحمَّل أي حزمة. مهمّته:
        ١. يرصد بقاء #root فارغاً بعد مهلة (أو فشل تحميل السكربت فوراً).
        ٢. يجرّب إعادة تحميل **واحدة** بتجاوز الكاش — تعالج index.html المتقادم
           المخزّن في المتصفح أو على الحافة، وهو السبب الأشيع.
        ٣. إن فشلت، يجلب عنوان الحزمة ويعرض **تشخيصاً حقيقياً** (رمز الحالة
           ونوع المحتوى) في بطاقة مرئية — بدل بياضٍ لا يقول شيئاً.
      لا يتدخّل إطلاقاً في المسار السليم: أول ما يُرسم شيء في #root يُلغى كلّه.
    -->
    <script>
      (function () {
        var RETRY_KEY = 'jaolaBootRetriedAt';
        var RETRY_TTL = 60000;   // نافذة الحارس: محاولة واحدة كل دقيقة
        var BOOT_TIMEOUT = 12000;  // مهلة سخيّة — شبكات الجوال البطيئة ليست عطباً
        var FAST_FAIL_AFTER = 3000; // لكن خطأً مُسجَّلاً لا ينتظر المهلة
        var root = document.getElementById('root');
        var settled = false;
        var timer = null;

        function booted() { return root && root.childElementCount > 0; }

        function ss(fn, fallback) {           // التصفح الخاص قد يمنع التخزين
          try { return fn(); } catch (e) { return fallback; }
        }

        // نجح الإقلاع → نظّف أثر إعادة المحاولة من شريط العنوان وأوقف الحارس
        function onBooted() {
          settled = true;
          if (timer) clearTimeout(timer);
          if (location.search.indexOf('_jaolaRetry=') !== -1) {
            var clean = location.pathname + location.search
              .replace(/[?&]_jaolaRetry=\d+/, '').replace(/^&/, '?') + location.hash;
            try { history.replaceState(null, '', clean); } catch (e) { /* لا ضير */ }
          }
        }

        function entrySrc() {
          var el = document.querySelector('script[type="module"][src]');
          return el ? el.src : null;
        }

        function card(diagnosis) {
          if (!root) return;
          root.innerHTML = '';
          var box = document.createElement('div');
          box.setAttribute('dir', 'rtl');
          box.style.cssText = 'min-height:100dvh;background:#050810;color:#e2e8f0;display:flex;'
            + 'align-items:center;justify-content:center;padding:24px;'
            + 'font-family:system-ui,-apple-system,"Segoe UI",sans-serif';
          var inner = document.createElement('div');
          inner.style.cssText = 'max-width:560px;text-align:center';
          inner.innerHTML =
            '<div style="font-size:40px;margin-bottom:12px">⚠️</div>'
            + '<h1 style="font-size:20px;margin:0 0 10px">تعذّر تحميل التطبيق'
            + '<span style="display:block;font-size:14px;color:#94a3b8;margin-top:4px">'
            + 'The application failed to load</span></h1>'
            + '<p style="color:#94a3b8;font-size:14px;line-height:1.8;margin:0 0 18px">'
            + 'لم تُنفَّذ حزمة التطبيق، فلم يبدأ شيء. أعد التحميل، وإن تكرر فأرسل لنا النصّ أدناه.</p>';
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'إعادة التحميل — Reload';
          btn.style.cssText = 'background:#3b82f6;color:#fff;border:0;border-radius:10px;'
            + 'padding:10px 22px;font-size:15px;font-weight:600;cursor:pointer';
          btn.onclick = function () { location.reload(); };
          var nuke = document.createElement('button');
          nuke.type = 'button';
          nuke.textContent = 'تنظيف الكاش وSW ثم إعادة التحميل';
          nuke.style.cssText = 'margin-inline-start:8px;background:transparent;color:#94a3b8;'
            + 'border:1px solid #334155;border-radius:10px;padding:10px 18px;font-size:14px;cursor:pointer';
          nuke.onclick = function () {
            var jobs = [];
            try {
              if ('serviceWorker' in navigator) {
                jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
                  return Promise.all(rs.map(function (r) { return r.unregister(); }));
                }));
              }
            } catch (e) { /* لا ضير */ }
            try {
              if (window.caches && caches.keys) {
                jobs.push(caches.keys().then(function (ks) {
                  return Promise.all(ks.map(function (k) { return caches.delete(k); }));
                }));
              }
            } catch (e) { /* لا ضير */ }
            Promise.all(jobs).catch(function () {}).then(function () {
              try { sessionStorage.removeItem(RETRY_KEY); } catch (e) { /* لا ضير */ }
              location.replace(location.pathname);
            });
          };
          var pre = document.createElement('pre');
          pre.style.cssText = 'margin-top:18px;text-align:left;direction:ltr;font-size:11px;'
            + 'color:#64748b;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto';
          pre.textContent = diagnosis;
          inner.appendChild(btn);
          inner.appendChild(nuke);
          inner.appendChild(pre);
          box.appendChild(inner);
          root.appendChild(box);
        }

        // service worker مسيطر يفسّر «تصل سليمة ولا تُنفَّذ» — يستحق الذكر دائماً
        function env() {
          var sw = 'no';
          try {
            if ('serviceWorker' in navigator) {
              sw = navigator.serviceWorker.controller ? 'CONTROLLING' : 'registered-or-none';
            }
          } catch (e) { sw = 'unknown'; }
          return 'service-worker: ' + sw;
        }

        function errors() {
          var list = (window.__jaolaErrors || []).slice(0, 3);
          return list.length ? '\n\n--- errors ---\n' + list.join('\n') : '\n\n(no JS errors captured)';
        }

        // ⚠️ درس (٢٥ أغسطس ٢٠٢٦، jaola.dev حيّاً): الحكم كان يعامل **كل** خطأٍ
        // مُسجَّل على أنه استثناءٌ عند التنفيذ، فقال «تصل سليمة لكنها ترمي»
        // بينما الأخطاء الفعلية كانت جميعها `load-failed:` — عنصر تحميل (سكربت أو ستايل)
        // فشل تحميله (حدث error على العنصر)، لا استثناءً رُمي بعد تنفيذ الشيفرة.
        // هذا فرقٌ جوهري: الأول يعني «المتصفح رفض الطلب»، والثاني يعني «الطلب
        // نجح والشيفرة عطبة». الحكم الآن يفرّق بينهما بدل استنتاجٍ خاطئ واحد.
        function classifyErrors(entrySrcUrl) {
            var list = window.__jaolaErrors || [];
            var loadFailed = [], thrown = [], entryBlocked = false;
            for (var i = 0; i < list.length; i++) {
                if (list[i].indexOf('load-failed:') === 0) {
                    loadFailed.push(list[i]);
                    // 🎯 المهم هو حزمة الدخول نفسها، لا أي مورد آخر: CSS قد يفشل
                    // لسببٍ عرَضي غير مرتبط (خط مفقود مثلاً) بينما حزمة الدخول
                    // تُنفَّذ وترمي فعلاً — فحصر الحكم بها يمنع تشخيصاً خاطئاً.
                    if (entrySrcUrl && list[i].indexOf(entrySrcUrl) !== -1) entryBlocked = true;
                } else {
                    thrown.push(list[i]);
                }
            }
            return { loadFailed: loadFailed, thrown: thrown, entryBlocked: entryBlocked };
        }

        // يجلب حزمة الدخول ليقول **لماذا** فشلت: 404؟ أم HTML مكان جافاسكربت؟
        function diagnose() {
          var src = entrySrc();
          var cls = classifyErrors(src);
          var base = 'entry: ' + (src || '(no module script found)');
          if (!src || typeof fetch !== 'function') return card(base);
          fetch(src, { cache: 'no-store' }).then(function (res) {
            var ct = res.headers.get('content-type') || '(none)';
            var verdict;
            if (!res.ok) {
              verdict = 'الحزمة غير موجودة على الخادم (نشر متقادم أو ناقص).';
            } else if (/html/i.test(ct)) {
              verdict = 'الخادم يردّ HTML مكان جافاسكربت — احتياط توجيه SPA يبتلع الأصل المفقود.';
            } else if (cls.entryBlocked) {
              // 🧩 التناقض هو الدليل: عنصر التحميل (وسم سكربت أو وسم ستايل) فشل
              // تحميله (حدث error)، بينما fetch() لنفس الرابط هنا ينجح بـ200 ونوع
              // محتوى سليم في اللحظة نفسها تقريباً. الخادم إذن ليس العلّة — شيءٌ
              // بين المتصفح والشبكة يميّز طلب عنصر التحميل عن طلب fetch() العادي
              // ويرفض الأول فقط: إضافة حجب إعلانات/خصوصية، أو طبقة أمان (بروكسي/
              // جدار شركة) تصنّف الطلبات بنوعها. جرّب نافذة خاصة بلا إضافات، أو
              // متصفحاً آخر، أو شبكة أخرى (بيانات الجوال بدل واي فاي) لعزل الطبقة.
              verdict = 'المتصفح رفض تحميل المورد كعنصر (لا فشل تنفيذ) — لكن نفس الرابط '
                + 'يستجيب سليماً حين يُجلب هنا مباشرة. الخادم سليم؛ الأرجح إضافة '
                + 'متصفح أو طبقة أمان شبكية تحجب حسب نوع الطلب. جرّب نافذة خاصة '
                + 'بلا إضافات، أو متصفحاً/شبكةً أخرى.';
            } else if (cls.thrown.length) {
              verdict = 'الحزمة تصل سليمة لكنها ترمي عند التنفيذ — الخطأ أعلاه.';
            } else {
              verdict = 'الحزمة تصل سليمة ولا ترمي شيئاً — يُرجَّح تدخّل service worker أو إضافة متصفح.';
            }
            card(base + '\nstatus: ' + res.status + '\ncontent-type: ' + ct
              + '\n' + env() + errors() + '\n\n' + verdict);
          }).catch(function (err) {
            card(base + '\nfetch failed: ' + (err && err.message ? err.message : err)
              + '\n' + env() + errors() + '\n\nتعذّر الوصول للحزمة أصلاً — شبكة أو حجب.');
          });
        }

        function fail() {
          if (settled) return;              // انتهى الأمر — نجاحاً أو بتشخيصٍ معروض
          if (booted()) { onBooted(); return; }
          settled = true;
          if (timer) clearTimeout(timer);
          // محاولة واحدة بتجاوز الكاش — تعالج index.html المتقادم، وهو الأشيع
          var last = ss(function () { return Number(sessionStorage.getItem(RETRY_KEY) || 0); }, NaN);
          if (!isNaN(last) && Date.now() - last > RETRY_TTL) {
            ss(function () { sessionStorage.setItem(RETRY_KEY, String(Date.now())); });
            var sep = location.search ? '&' : '?';
            location.replace(location.pathname + location.search + sep + '_jaolaRetry=' + Date.now() + location.hash);
            return;
          }
          diagnose();
        }

        // فشل تحميل/تنفيذ سكربت الوحدة يصل هنا في طور الالتقاط — أسرع من المهلة
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.type === 'module') fail();
        }, true);

        // ⏱️ العدّ يبدأ من DOMContentLoaded لا من load. الفرق ليس تجميلياً:
        // حدث load ينتظر كل الموارد، وحين يكون العطب في المورد نفسه يتأخّر
        // load كثيراً — قياسٌ فعلي أظهر ظهور البطاقة بعد ٥٣ ثانية بدل ١٢.
        // والمستخدم أمام بياضٍ طوالها، وهو ما جئنا نعالجه أصلاً.
        var started = 0;
        function start() {
          if (started) return;
          started = Date.now();
          if (booted()) return onBooted();
          timer = setTimeout(fail, BOOT_TIMEOUT);
          var poll = setInterval(function () {
            if (settled) return clearInterval(poll);
            if (booted()) { clearInterval(poll); onBooted(); return; }
            // 🏃 مسار سريع: خطأ مُسجَّل + جذر فارغ = حكمٌ قاطع، فلا داعي
            // لاستنفاد المهلة. المهلة الطويلة للشبكة البطيئة، لا لعطبٍ معلوم.
            var errs = window.__jaolaErrors || [];
            if (errs.length && Date.now() - started > FAST_FAIL_AFTER) {
              clearInterval(poll);
              fail();
            }
          }, 500);
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start);
        } else {
          start();
        }
        window.addEventListener('load', start);   // شبكة أمان لو فات الأول
      })();
    </script>
  </body>
</html>
